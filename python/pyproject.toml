[project]
name = "decidio"
version = "0.21.0"
description = "One-line approval gate for AI-agent actions — the agent suspends for human approval and resumes, sealing a portable Authority Receipt the customer owns. Decidio gates + records; the agent executes its own action."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "FSL-1.1-ALv2" }
authors = [{ name = "OmniTwin Technologies Inc." }]
keywords = ["ai-agents", "approvals", "human-in-the-loop", "authority", "audit", "agent-governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# cryptography is a BASE dependency, not an extra (blind-review catch): the README's own
# `pip install decidio` shipped a product whose quickstart and advertised built-in verifier both
# crash without it. Everything else is stdlib; adapters add their own optional deps.
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://decidioai.com/developers/"

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
temporal = ["temporalio>=1.6"]
openai = ["openai-agents>=0.1"]   # RunState/ToolApprovalItem verified (§16.3)
verify = []      # cryptography moved to base — extra kept so documented installs keep working
signing = []     # cryptography moved to base — extra kept so documented installs keep working
dev = []

[project.scripts]
decidio = "decidio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decidio"]

[tool.hatch.build.targets.sdist]
# Only the package + its papers. The root-level smokes/conformance scripts shell out to the
# MONOREPO (npx tsx against apps/api) and cannot run from an installed sdist — shipping them
# would be a broken promise, so they stay repo-only.
include = ["decidio", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "pyproject.toml"]
# hatchling ALWAYS puts the package's .gitignore in the sdist (its build-from-sdist rules need it) and
# `exclude` cannot remove it. It is therefore an APPROVED sdist member in
# packages/publish-boundary/manifest.json - six ignore lines, not a disclosure; the check locks the
# path and this tracked file is the content - and the boundary check fails the release on anything else.
